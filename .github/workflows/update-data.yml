name: Actualizar datos del canal

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos públicos de YouTube
        run: python scripts/update_data.py

      - name: Confirmar cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/channel.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Actualizar datos del canal de YouTube"
            git push
          fi
